<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audikite</title>
    
    <!-- Lexend Deca Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Core Palette */
            --bg-dark: #07090e;
            --bg-light: #e4e4e6;
            --brand-cyan: #14e7fa;
            
            /* Dynamic Theme Variables (Defaulting to Dark Mode) */
            --bg-color: var(--bg-dark);
            --text-color: var(--bg-light);
            --surface-color: rgba(228, 228, 230, 0.03);
            --surface-border: rgba(228, 228, 230, 0.1);
        }

        /* Automatic Light Mode Support */
        @media (prefers-color-scheme: light) {
            :root {
                --bg-color: var(--bg-light);
                --text-color: var(--bg-dark);
                --surface-color: rgba(7, 9, 14, 0.04);
                --surface-border: rgba(7, 9, 14, 0.15);
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Lexend Deca', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        main {
            width: 100%;
            max-width: 720px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2.5rem;
        }

        .brand-logo {
            font-size: 2.25rem;
            font-weight: 600;
            letter-spacing: -0.04em;
            user-select: none;
            /* Gradient text effect: solid text color fading into the background color */
            background: linear-gradient(to bottom, var(--text-color) 85%, var(--bg-color) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .search-container {
            width: 100%;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 1.25rem 1.5rem;
            font-size: 1.125rem;
            font-family: inherit;
            font-weight: 400;
            background-color: var(--surface-color);
            border: 1px solid var(--surface-border);
            border-radius: 16px;
            color: var(--text-color);
            outline: none;
            transition: all 0.2s ease;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.05);
        }

        .search-input::placeholder {
            color: var(--text-color);
            opacity: 0.4;
        }

        .search-input:focus {
            border-color: var(--brand-cyan);
            box-shadow: 0 0 0 4px rgba(20, 231, 250, 0.1);
            background-color: transparent;
        }

        .quick-actions {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .action-chip {
            padding: 0.75rem 1.5rem;
            border-radius: 100px;
            border: 1px solid var(--surface-border);
            background: transparent;
            color: var(--text-color);
            font-family: inherit;
            font-size: 0.875rem;
            font-weight: 400;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .action-chip:hover {
            background-color: var(--surface-color);
            border-color: var(--text-color);
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <main>
        <div class="brand-logo">Audikite</div>
        
        <div class="search-container">
            <input type="text" class="search-input" placeholder="Find tuners, sheets, practice tools..." autocomplete="off" autofocus>
        </div>

        <div class="quick-actions">
            <button class="action-chip">Practice</button>
            <button class="action-chip">Tune</button>
            <button class="action-chip">Learn</button>
        </div>
    </main>

</body>
</html>
